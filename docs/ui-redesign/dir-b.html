if(embed)document.body.classList.add('embed');else{document.getElementById('app').remove();document.body.innerHTML=`<main class="board"><header class="board-head"><div><a class="backlink" href="index.html">返回早期方向对照</a><h1>B / 数学手记</h1><p>以题目和推理为中心，把错题本做成真正愿意翻的笔记。</p></div><span class="tag">早期对照候选</span></header><section class="showcase">${[['home','首页 / 开始一道错题'],['result','报告 / 先思考，再看提示'],['input','录入 / 题目与思路'],['history','错题本 / 随时回来复习'],['stats','学情 / 找到复习重点']].map(([screen,label])=>`<figure><figcaption>${label}</figcaption><iframe title="${label}" src="dir-b.html?embed=1&screen=${screen}"></iframe></figure>`).join('')}</section><p class="board-footer">离线交互原型。题目、列表和统计均为演示样本；不调用模型，不读取或改写真实错题。<br>单屏使用相同的 390 × 844 可用视口；可点击录题、报告页签、提示、答案、筛选及底部导航。视觉通过不等于小程序运行验收。</p></main>`;}
if(embed){
const svg=(name,extra='')=>`<svg class="icon ${extra}" viewBox="0 0 24 24" aria-hidden="true">${({camera:'<path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/>',edit:'<path d="M14 5l5 5M4 20l4-1L20 7l-4-4L4 15z"/>',book:'<path d="M4 4h6l2 2 2-2h6v16h-6l-2 1-2-1H4zM12 6v15"/>',chart:'<path d="M4 4v16h17M8 16v-5M13 16V7M18 16V4"/>',home:'<path d="M3 11l9-8 9 8M5 10v11h5v-6h4v6h5V10"/>',chevron:'<path d="M9 5l7 7-7 7"/>',back:'<path d="M15 5l-7 7 7 7"/>',arrow:'<path d="M12 19V5M6 11l6-6 6 6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M16 16l5 5"/>',trash:'<path d="M4 6h16M9 3h6M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',bulb:'<path d="M9 18h6M9 21h6M8 15a7 7 0 1 1 8 0l-1 3H9z"/>',shield:'<path d="M12 3l8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6zM8 12l3 3 5-6"/>',plus:'<path d="M12 5v14M5 12h14"/>'})[name]||''}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={home:'首页',input:'错题录入',result:'诊断报告',history:'错题本',stats:'学情分析'};
const fixtureQuestion='解一元一次方程：2(x-3)=x+4。';
const fixtureAnswer='2x-6=x+4，所以2x-x=4-6，因此x=-2。';
const initialRecords=[['方程','解方程：2(x−3)=x+4','移项时忘记变号','今天 16:20'],['导数','求函数 f(x)=x³−3x 的单调区间','单调区间端点处理不当','昨天 19:35'],['三角函数','已知 sin α=3/5，求 cos α','忽略角的取值范围','昨天 18:10'],['方程','解方程：3(x−2)=x+1','计算过程粗心出错','10月28日'],['导数','求 y=(x²+1)³ 的导数','复合函数求导漏链式法则','10月27日'],['三角函数','化简 sin(π−α)+sin α','诱导公式符号判断错误','10月26日'],['导数','求 f(x)=x+1/x 的最小值','忽略定义域','10月25日'],['方程','解方程：5x−7=2x+8','计算过程粗心出错','10月24日']];
let records=initialRecords.map((r,i)=>({id:i,kp:r[0],q:r[1],cause:r[2],time:r[3]}));
let state={screen:new URLSearchParams(location.search).get('screen')||'home',tab:'steps',q:fixtureQuestion,answer:fixtureAnswer,filter:'全部',search:'',hint:{},detail:{},variant:{},solution:false,chatError:false,busy:false};
const theme=document.body.dataset.theme;
const app=document.getElementById('app');
function nav(screen){state.screen=screen;render()}
function header(){return `<header class="wx-head">${state.screen==='home'?(theme==='a'?'':'<span class="brand-symbol">x</span>'):`<button class="back" data-nav="home" aria-label="返回首页">${svg('back')}</button>`}<span class="wx-name">${state.screen==='home'?'错因智诊':names[state.screen]}</span><div class="capsule" aria-label="微信小程序菜单示意"><span>···</span><span>◉</span></div></header>`}
function bottom(){return `<nav class="bottom" aria-label="主要功能">${[['home','home','学习'],['history','book','错题本'],['stats','chart','学情']].map(([id,ic,label])=>`<button data-nav="${id}" class="${(state.screen===id||(id==='home'&&['input','result'].includes(state.screen)))?'active':''}"><span class="nav-icon">${svg(ic)}</span>${label}</button>`).join('')}</nav>`}
function recent(){return records.slice(0,3).map((r,i)=>`<button class="recent-row" data-record="${r.id}">${theme==='a'?'':`<span class="row-math">${['x','f′','sin'][i]}</span>`}<span class="row-content"><span class="row-title">${esc(r.q)}</span><span class="row-meta">${esc(r.cause)}</span></span>${svg('chevron','chevron')}</button>`).join('')}
function topSections(){return `<nav class="top-sections" aria-label="主要功能"><button data-nav="home" class="${state.screen==='home'?'active':''}">开始学习</button><button data-nav="history" class="${state.screen==='history'?'active':''}">错题本</button><button data-nav="stats" class="${state.screen==='stats'?'active':''}">我的学情</button></nav>`}
function home(){let hero='';if(theme==='a')hero=`<div class="welcome"><h2 class="page-title">把这道题，<br>真正弄懂。</h2><p class="welcome-note">找到错因，比记住答案更重要。</p></div><div class="scan-card"><h3>拍下这道错题</h3><p>带上你的解题过程<br>一起找到卡住的那一步</p><div class="math-preview" aria-hidden="true">2(x − 3) = x + 4</div><button class="scan-action" data-action="camera">${svg('camera')}拍照录题</button></div><button class="manual-row" data-nav="input">${svg('edit')}<span>手动输入题目</span>${svg('chevron','chevron')}</button>`;
if(theme==='b')hero=`<div class="folio-header"><span>我的数学手记</span>${svg('book')}</div><div class="welcome"><h2 class="page-title">把没想通的，<br>再想通一次。</h2><p class="welcome-note">一道题，一次把思路理清的机会。</p></div><div class="paper-problem"><span class="paper-caption">从今天的一道错题开始</span>2(x − 3) = x + 4</div><div class="paper-actions"><button class="primary" data-nav="input">${svg('edit')}记一道错题</button><button class="secondary" data-action="camera">${svg('camera')}拍照录入</button></div>`;
if(theme==='c')hero=`${topSections()}<div class="welcome"><h2 class="page-title">不止改对。<br>还要弄懂。</h2><p class="welcome-note">让每一道错题，都成为下一次的底气。</p></div><div class="orange-sheet"><span class="sheet-caption">从一道数学题开始</span><div class="sheet-formula">2(x − 3) = x + 4</div><div class="paper-actions"><button class="primary" data-action="camera">${svg('camera')}拍照录题</button><button class="secondary" data-nav="input">${svg('edit')}手动输入</button></div></div>`;
return `${hero}<div class="section-head"><h3>${theme==='b'?'最近的思考':'最近的错题'}</h3><button class="quiet-link" data-nav="history">查看全部</button></div>${recent()}<div class="learning-note">${svg('bulb')}<span>先试着回忆解法，再打开提示。<br>每次多想一步，知识就会更牢一点。</span></div>`}
function input(){return `<h2 class="page-title">先把题目记下来</h2><p class="page-sub">有解题过程，就更容易找到具体的错因。</p><div class="input-tools"><button data-action="camera">${svg('camera')}从照片识别</button><button data-action="fixture">使用示例</button></div><div class="field"><label class="field-top" for="question">题目<span class="required">必填</span><span class="counter" id="q-count">${state.q.length}/2000</span></label><textarea id="question" maxlength="2000" aria-label="错题题干" placeholder="输入完整题目，包括已知条件和问题">${esc(state.q)}</textarea></div><div class="field"><label class="field-top" for="wrong-answer">我的解题过程<span class="required">选填</span><span class="counter" id="a-count">${state.answer.length}/1000</span></label><textarea id="wrong-answer" class="answer" maxlength="1000" placeholder="写下你的答案，或者卡住的步骤">${esc(state.answer)}</textarea><p class="field-tip">算到一半也没关系，把已有的思路写下来。</p></div><button class="primary full" id="analyze" data-action="analyze" ${state.busy||!state.q.trim()?'disabled':''}>${state.busy?'正在分析这道题…':'开始分析错因'}</button><p class="privacy-note">诊断成功后，题目会进入错题本。<br>你随时可以回来复习。</p>`}
const steps=[['先把括号展开','2 要分别乘以括号里的哪两项？','利用分配律，2 要同时乘以 x 和 −3。','2(x−3)=2x−6，所以方程变为 2x−6=x+4。这一步你做对了。'],['把同类项放在一起','−6 移到等号右边，符号应该怎样变化？','可以在等式两边同时加上 6，再同时减去 x。','2x−x=4+6，因此 x=10。移项后 −6 应变为 +6。'],['把结果代回去检验','得到的 x，能让等式两边相等吗？','分别算出左边和右边的值，再比较。','代入 x=10，左边 2×(10−3)=14，右边 10+4=14，结果正确。']];
function stepPane(){return `<p class="small-label">先思考，想不通再展开提示。</p>${steps.map((s,i)=>`<section class="study-step"><div class="step-head"><span class="step-number">${i+1}</span><div class="step-copy"><strong>${s[0]}</strong>${s[1]}</div></div><div class="step-acts"><button data-hint="${i}" aria-expanded="${!!state.hint[i]}">${state.hint[i]?'收起提示':'看提示'}</button><button data-detail="${i}" aria-expanded="${!!state.detail[i]}">${state.detail[i]?'收起解答':'看本步解答'}</button></div>${state.hint[i]?`<div class="reveal">${s[2]}</div>`:''}${state.detail[i]?`<div class="reveal">${s[3]}</div>`:''}</section>`).join('')}<button class="solution-toggle" data-action="solution" aria-expanded="${state.solution}">查看完整解答<span>${state.solution?'−':'+'}</span></button>${state.solution?'<div class="solution">2x − 6 = x + 4<br>2x − x = 4 + 6<br>x = 10<br><span class="small-label">代回检验：等式两边均为 14。</span></div>':''}`}
function diagnosisPane(){return `<span class="cause-label">计算性错误 / 移项符号</span><p class="diagnosis">你去括号的步骤是正确的。问题出在第二步：把左边的 <strong>−6</strong> 移到右边时，忘记变为 <strong>+6</strong>，写成了 4−6。<br><br>正确应当是 2x−x=4+6，得到 <strong>x=10</strong>。下次遇到移项，可以先用“等式两边做相同操作”来检查符号。</p><div class="confidence">诊断参考分数 97<br>这个分数仅供参考，不代表经验证的准确率。原始节点：计算过程粗心出错。</div>`}
function variantPane(){return `<p class="small-label">先独立做一遍，再核对答案。</p>${[['基础巩固','3(x − 2) = x + 1','x=7/2；展开后 2x=7。'],['中等提升','2(x + 3) = 3(2x − 1) + 1','x=2；展开后 −4x=−8。'],['能力拓展','2(x − a) = 3x + 1','x=−2a−1；展开后 −x=2a+1。']].map((v,i)=>`<section class="variant"><h3>${v[0]}</h3><p>${v[1]}</p><button data-variant="${i}" aria-expanded="${!!state.variant[i]}">${state.variant[i]?'收起答案与解析':'展开答案与解析'}</button>${state.variant[i]?`<div class="reveal">${v[2]}</div>`:''}</section>`).join('')}<p class="field-tip">在纸上作答后自行核对。当前没有在线批改功能。</p>`}
function result(){return `<span class="topic">方程 / 一元一次方程</span><h2 class="result-title">找到这道题的<br>关键一步</h2><div class="problem-box"><span class="small-label">原题</span><div class="formula">2(x − 3) = x + 4</div><div class="wrong-line"><span class="small-label">我的作答</span><span>2x − x = 4 <span class="wrong">− 6</span></span></div></div><nav class="tabs" aria-label="报告内容">${[['steps','分步思考'],['diagnosis','错因分析'],['variants','变式练习']].map(([id,t])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${t}</button>`).join('')}</nav><div id="report-pane">${state.tab==='steps'?stepPane():state.tab==='diagnosis'?diagnosisPane():variantPane()}</div><section class="chat-box"><h3>还有哪一步没想通？</h3><p>围绕这道题，继续问一问。</p><div class="chat-entry"><input id="chat-input" maxlength="500" aria-label="向 AI 老师追问" placeholder="例如：为什么移项要变号？"><button data-action="chat" aria-label="发送追问">${svg('arrow')}</button></div>${state.chatError?'<div class="chat-error" role="status">暂未收到回复，请稍后重试。<br>你也可以先看分步提示。</div>':''}</section><button class="secondary full" style="margin-top:24px" data-nav="input">再记一道错题</button>`}
function historyRows(){const q=state.search.toLowerCase();const filtered=records.filter(r=>(state.filter==='全部'||r.kp===state.filter)&&(!q||(r.q+r.kp+r.cause).toLowerCase().includes(q)));return filtered.length?filtered.map(r=>`<article class="record"><button class="record-open" data-record="${r.id}"><span class="topic">${r.kp}</span><span class="record-title">${esc(r.q)}</span><span class="record-time">${esc(r.cause)}<br>${esc(r.time)}</span></button><button class="record-delete" aria-label="移除示例错题" data-delete="${r.id}">${svg('trash')}</button></article>`).join(''):`<div class="empty">${svg('search')}<h3>没有找到这道题</h3><p>换个关键词，或者选择其他考点。</p></div>`}
function history(){return `${theme==='c'?topSections():''}<h2 class="page-title">我的错题本</h2><p class="page-sub">留下错过的题，也留下想通的过程。</p><label class="search">${svg('search')}<input id="search" placeholder="搜索题目或考点" aria-label="搜索错题" value="${esc(state.search)}"></label><nav class="filters" aria-label="按考点筛选">${['全部','方程','导数','三角函数'].map(k=>`<button data-filter="${k}" class="${state.filter===k?'active':''}">${k}</button>`).join('')}</nav><div class="history-count">${records.length} 道已收录错题</div><div id="records">${historyRows()}</div><button class="clear-btn" data-action="clear">清空错题本</button>`}
function stats(){const kp=records.reduce((m,r)=>(m[r.kp]=(m[r.kp]||0)+1,m),{});const sorted=Object.entries(kp).sort((a,b)=>b[1]-a[1]);const causes=Object.entries(records.reduce((m,r)=>(m[r.cause]=(m[r.cause]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]);return `${theme==='c'?topSections():''}<h2 class="page-title">看见自己的薄弱点</h2><p class="page-sub">从错题中，找到下一步该复习什么。</p><div class="stats-overview"><span class="stat-big">${records.length}</span><div class="stat-side"><strong>道题，值得再想一遍</strong><span>根据错题本中的诊断统计</span><div class="stat-mini"><span><b>${sorted.length}</b>个考点</span><span><b>${causes.length}</b>种错因</span></div></div></div><h3 class="chart-heading">哪些考点容易出错</h3><p class="chart-sub">记录次数不等于掌握程度，仅供复习参考。</p>${sorted.map(([k,n])=>`<div class="bar-row"><div class="bar-label"><span>${k}</span><span>${n} 题</span></div><div class="bar-track"><div class="bar-fill" style="width:${records.length?n/records.length*100:0}%"></div></div></div>`).join('')}<div class="section-head"><h3>反复出现的错因</h3></div>${causes.slice(0,3).map(([c,n],i)=>`<div class="cause-rank"><span class="rank-no">${i+1}</span><span>${c}</span><span class="rank-count">${n} 次</span></div>`).join('')}<div class="advice"><h3>下一次，从这里开始</h3><p>先回看「${sorted[0]?.[0]||'方程'}」相关错题的关键步骤，再独立做一道同类变式题。</p></div><details class="tree"><summary>查看错因地图</summary>${causes.map(([c,n])=>`<p>${c}　${n} 次</p>`).join('')}<p>此处展示示例记录触发的节点；正式版保留完整 50 节点库。</p></details>`}
function modal(title,text){const div=document.createElement('div');div.className='modal-shade';div.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${esc(text)}</p><button class="primary" data-dismiss>知道了</button></section>`;app.appendChild(div);div.querySelector('button').focus();div.querySelector('[data-dismiss]').onclick=()=>div.remove()}
function render(){app.innerHTML=header()+`<main class="content">${({home,input,result,history,stats})[state.screen]()}</main>`+bottom();bind()}
function reReport(){const scroll=document.querySelector('.content').scrollTop;render();document.querySelector('.content').scrollTop=scroll}
function bind(){app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));app.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>b.dataset.record==='0'?nav('result'):modal('列表演示条目','这个条目用于展示列表排版。首条方程提供完整的诊断示例。'));app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;reReport()});for(const key of ['hint','detail','variant'])app.querySelectorAll(`[data-${key}]`).forEach(b=>b.onclick=()=>{state[key][b.dataset[key]]=!state[key][b.dataset[key]];reReport()});app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>modal('演示删除入口','正式小程序会要求确认删除。这份视觉原型不会删除或修改你的真实错题。'));const qs=app.querySelector('#question'),wa=app.querySelector('#wrong-answer'),search=app.querySelector('#search');if(qs)qs.oninput=()=>{state.q=qs.value;app.querySelector('#q-count').textContent=state.q.length+'/2000';app.querySelector('#analyze').disabled=!state.q.trim()};if(wa)wa.oninput=()=>{state.answer=wa.value;app.querySelector('#a-count').textContent=state.answer.length+'/1000'};if(search)search.oninput=()=>{state.search=search.value;app.querySelector('#records').innerHTML=historyRows();app.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>b.dataset.record==='0'?nav('result'):modal('列表演示条目','首条方程提供完整的诊断示例。'))};app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}
function action(id){if(id==='camera')return modal('拍照录题','正式小程序会打开相机或相册，识别后可校对题目。这份原型不申请相机权限；可以先用手动输入体验录题流程。');if(id==='fixture'){state.q=fixtureQuestion;state.answer=fixtureAnswer;return render()}if(id==='analyze'){if(!state.q.replaceAll(' ','').includes('2(x-3)=x+4'))return modal('试试示例题','这份离线原型只提供固定方程的演示报告。请点“使用示例”后继续，任意题目的真实分析需在正式小程序进行。');state.busy=true;render();setTimeout(()=>{state.busy=false;state.tab='steps';nav('result')},500);return}if(id==='solution'){state.solution=!state.solution;return reReport()}if(id==='chat'){const inp=app.querySelector('#chat-input');if(!inp.value.trim())return inp.focus();state.chatError=true;reReport();app.querySelector('.content').scrollTop=10000;return}if(id==='clear')return modal('清空错题本','正式小程序会弹出二次确认。这份原型不会清空你的错题记录。')}
if(!Object.hasOwn(names,state.screen))state.screen='home';render();
}
</script></body></html>
